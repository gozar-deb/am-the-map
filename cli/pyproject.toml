[project]
name = "am-map-cli"
version = "0.1.0"
description = "CLI for Am the Map -- WiFi/RF spatial sensing platform"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
]

[project.scripts]
am-map = "am_map.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["am_map"]
